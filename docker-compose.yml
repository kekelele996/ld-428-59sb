name: artvault

services:
  db:
    image: mongo:7
    container_name: ${COMPOSE_PROJECT_NAME:-artvault}-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    ports:
      - "${DB_PORT:-33328}:27017"
    volumes:
      - db_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "-u", "${MONGO_INITDB_ROOT_USERNAME}", "-p", "${MONGO_INITDB_ROOT_PASSWORD}", "--authenticationDatabase", "admin"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-artvault}-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-19308}:8080"
    environment:
      APP_ENV: production
      SERVER_PORT: 8080
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@db:27017/${MONGO_DB_NAME}?authSource=admin
      MONGO_DB_NAME: ${MONGO_DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:18808}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-120}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      LOGIN_RATE_WINDOW_SEC: ${LOGIN_RATE_WINDOW_SEC:-60}
      MONGO_CONNECT_TIMEOUT_SEC: 30
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-artvault}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-18808}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  db_data:
